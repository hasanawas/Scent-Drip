# Supabase pauses free projects after ~7 days with no activity.
# This job visits the database twice a week so the shop never goes to sleep.
# Setup: README.md → Step 6.
name: Keep database awake

on:
  schedule:
    - cron: "17 6 * * 1,4" # Mondays and Thursdays, 06:17 UTC
  workflow_dispatch: # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::warning::Add SUPABASE_URL and SUPABASE_KEY repository secrets (README step 6)."
            exit 0
          fi
          curl -fsS "$SUPABASE_URL/rest/v1/perfumes?select=id&limit=1" -H "apikey: $SUPABASE_KEY"
          echo "Database is awake ✅"
