# Supabase pauses free projects after ~7 days with no activity.
# This job visits the database twice a week so the shop never goes to sleep.
# Setup: README.md → Phase 7.
name: Keep database awake

on:
  schedule:
    - cron: "17 6 * * 1,4" # Mondays and Thursdays, 06:17 UTC
  workflow_dispatch: # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::warning::Add SUPABASE_URL and SUPABASE_KEY repository secrets (README → Phase 7)."
            exit 0
          fi
          BASE=$(echo "$SUPABASE_URL" | grep -oE '^https://[^/]+')
          curl -fsS "$BASE/rest/v1/perfumes?select=id&limit=1" -H "apikey: $SUPABASE_KEY"
          echo "Database is awake ✅"
