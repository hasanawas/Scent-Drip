<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Scent Drip Admin</title>
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="apple-touch-icon" href="images/favicon.png" />
  <meta name="theme-color" content="#0b0b0b" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a href="admin.html" class="logo"><img src="images/logo-mark.png" alt="" />Scent Drip <small>admin</small></a>
      <div style="display:flex;gap:8px">
        <a class="btn ghost small" href="./" target="_blank">View shop ↗</a>
        <button class="btn ghost small hidden" id="logout">Log out</button>
      </div>
    </div>
  </header>

  <main class="wrap" id="main">
    <!-- Login -->
    <form class="login-box form hidden" id="login-form">
      <img src="images/logo-mark-dark.png" alt="" />
      <h1>Welcome back</h1>
      <p>Log in to manage your shop.</p>
      <label>Email<input class="input" type="email" name="email" required autocomplete="username" /></label>
      <label>Password<input class="input" type="password" name="password" required autocomplete="current-password" /></label>
      <button class="btn neon block" type="submit">Log in</button>
    </form>

    <!-- Dashboard -->
    <section id="dashboard" class="hidden">
      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="orders">Orders <span class="pill hidden" id="new-count">0</span></button>
        <button class="tab" data-tab="inventory">Inventory</button>
      </nav>

      <!-- Orders tab -->
      <div id="tab-orders">
        <div class="stats" id="order-stats"></div>
        <div class="toolbar">
          <select class="input" id="status-filter" aria-label="Filter by status">
            <option value="">All orders</option>
            <option value="new" selected>New</option>
            <option value="confirmed">Confirmed</option>
            <option value="shipped">Shipped</option>
            <option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option>
          </select>
          <button class="btn outline small" id="enable-alerts">🔔 Enable pop-up alerts</button>
        </div>
        <div class="orders" id="orders-list"></div>
      </div>

      <!-- Inventory tab -->
      <div id="tab-inventory" class="hidden">
        <div class="stats" id="inventory-stats"></div>
        <div class="toolbar">
          <input class="input" type="search" id="inv-search" placeholder="Search…" aria-label="Search inventory" />
          <button class="btn neon" id="add-perfume">＋ Add perfume</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th></th><th>Perfume</th><th class="num">In stock</th><th class="num">Bought for</th>
                <th class="num">Selling price</th><th class="num">Profit / unit</th><th class="num">Stock value</th>
                <th>Visible</th><th></th>
              </tr>
            </thead>
            <tbody id="inventory-body"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <!-- Add / edit perfume -->
  <div class="overlay hidden" id="overlay"></div>
  <div class="modal hidden" id="perfume-modal" role="dialog" aria-modal="true" aria-labelledby="perfume-modal-title">
    <button class="icon-btn close" id="close-modal" aria-label="Close">✕</button>
    <h2 id="perfume-modal-title">Add perfume</h2>
    <form class="form" id="perfume-form">
      <input type="hidden" name="id" />
      <div class="form-row">
        <label>Perfume name *<input class="input" name="name" required maxlength="120" /></label>
        <label>Brand<input class="input" name="brand" maxlength="80" /></label>
      </div>
      <div class="form-row">
        <label>Category <span class="hint">e.g. Men, Women, Unisex</span>
          <input class="input" name="category" list="category-list" maxlength="40" />
          <datalist id="category-list"><option value="Men"><option value="Women"><option value="Unisex"></datalist>
        </label>
        <label>Size (ml)<input class="input" name="size_ml" type="number" min="1" step="1" /></label>
      </div>
      <div class="form-row">
        <label>Price you bought it for * <span class="hint">(only you see this)</span>
          <input class="input" name="cost_price" type="number" min="0" step="0.01" required />
        </label>
        <label>Selling price * <span class="hint">(customers see this)</span>
          <input class="input" name="selling_price" type="number" min="0" step="0.01" required />
        </label>
      </div>
      <div class="form-row">
        <label>Quantity in stock *<input class="input" name="stock" type="number" min="0" step="1" required /></label>
        <label>Supplier <span class="hint">(only you see this)</span><input class="input" name="supplier" maxlength="120" /></label>
      </div>
      <label>Description<textarea class="input" name="description" rows="3" maxlength="2000"></textarea></label>
      <label>Photo
        <div style="display:flex;gap:12px;align-items:center">
          <img id="img-preview" class="img-preview hidden" alt="" />
          <input class="input" type="file" name="image" accept="image/*" />
        </div>
        <input type="hidden" name="image_url" />
      </label>
      <label class="checkbox"><input type="checkbox" name="is_active" checked /> Show this perfume in the shop</label>
      <button class="btn neon block" type="submit" id="save-perfume">Save perfume</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
